<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
<meta name="theme-color" content="#6366f1" />
<title>InvoicePro — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="login-wrap">
    <div class="login-card">
      <h1 class="brand">🧾 InvoicePro</h1>
      <p class="muted">Sign in to manage your shop</p>

      <div class="tabs">
        <button class="tab active" data-tab="login">Login</button>
        <button class="tab" data-tab="signup">Sign Up</button>
      </div>

      <!-- LOGIN -->
      <form id="loginForm" class="form">
        <label>Email</label>
        <input type="email" id="loginEmail" required autocomplete="email" placeholder="you@example.com" />

        <label>Password</label>
        <input type="password" id="loginPassword" required autocomplete="current-password" placeholder="••••••••" />

        <button type="submit" class="btn primary">Sign In →</button>
      </form>

      <!-- SIGNUP -->
      <form id="signupForm" class="form hidden">
        <label>Full Name</label>
        <input type="text" id="signupName" required placeholder="John Doe" />

        <label>Email</label>
        <input type="email" id="signupEmail" required autocomplete="email" placeholder="you@example.com" />

        <label>Password</label>
        <input type="password" id="signupPassword" required minlength="6" placeholder="Min 6 characters" />

        <label>Role</label>
        <select id="signupRole">
          <option value="worker">Shop Worker</option>
          <option value="admin">Admin</option>
        </select>

        <button type="submit" class="btn primary">Create Account ✨</button>
      </form>

      <div id="authMsg" class="msg"></div>
    </div>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
