<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
<meta name="theme-color" content="#6366f1" />
<title>Create Invoice — H.S Computers & CCTV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/invoice.css" />
</head>
<body>

<div class="invoice-toolbar no-print">
  <button class="btn ghost" onclick="history.back()">← Back</button>
  <div>
    <button class="btn primary" id="saveBtn">💾 Save Invoice</button>
    <button class="btn" id="printBtn">🖨 Print / PDF</button>
  </div>
</div>

<div id="invoicePage" class="invoice-page">

  <!-- HEADER -->
  <div class="inv-header">
    <div class="inv-shop-info">
      <img id="shopLogo" class="inv-logo hidden" alt="Shop Logo" />
      <div>
        <h1 id="shopNameDisplay" style="color:#6366f1">H.S Computers & CCTV</h1>
        <p id="shopAddrDisplay" style="color:#4b5563"></p>
        <p style="color:#4b5563">
          <span id="shopPhoneDisplay"></span> 
          <span id="shopEmailDisplay"></span>
        </p>
      </div>
    </div>
    <div class="inv-meta">
      <h2 style="color:#f59e0b">INVOICE</h2>
      <p style="color:#1f2937"><strong style="color:#1f2937">#</strong> <span id="invNo">-</span></p>
      <p style="color:#1f2937"><strong style="color:#1f2937">Date:</strong> <span id="invDate">-</span></p>
      <p style="color:#1f2937"><strong style="color:#1f2937">By:</strong> <span id="invBy">-</span></p>
    </div>
  </div>

  <!-- CUSTOMER -->
  <div class="inv-customer">
    <h3>Bill To</h3>
    <input class="no-print" id="custName" placeholder="Customer name *" />
    <div class="print-only">
      <p style="color:#1f2937"><strong style="color:#1f2937" id="custNameP"></strong></p>
    </div>
  </div>

  <!-- ITEMS TABLE -->
  <table class="inv-table">
    <thead>
      <tr>
        <th style="width:40px">#</th>
        <th>Item Description</th>
        <th style="width:70px">Qty</th>
        <th style="width:90px">Price</th>
        <th style="width:70px">Tax %</th>
        <th style="width:100px">Total</th>
        <th class="no-print" style="width:50px"></th>
      </tr>
    </thead>
    <tbody id="itemsBody"></tbody>
  </table>

  <button class="btn no-print" id="addItemBtn" style="margin-top:12px">+ Add Item</button>

  <!-- TOTALS -->
  <div class="inv-totals">
    <div><span>Subtotal</span> <span id="subtotal">PKR 0.00</span></div>
    <div><span>Tax</span> <span id="taxTotal">PKR 0.00</span></div>
    <div>
      <span>Discount</span>
      <input class="no-print small-input" type="number" id="discount" value="0" step="0.01" />
      <span class="print-only" id="discountP">PKR 0.00</span>
    </div>
    <div class="grand"><span>Grand Total</span> <span id="grandTotal">PKR 0.00</span></div>
  </div>

  <!-- PAYMENT SECTION -->
  <div class="inv-footer">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 10px;">
      
      <label>Payment Mode
        <select id="paymentMode" class="no-print" style="margin-top: 5px;">
          <option value="Cash">💵 Cash</option>
          <option value="UPI">📱 UPI</option>
          <option value="Card">💳 Card</option>
          <option value="Bank Transfer">🏦 Bank Transfer</option>
          <option value="Credit">📝 Credit (Udhaar)</option>
        </select>
        <span class="print-only" id="paymentModeP"></span>
      </label>

      <label>Payment Status
        <select id="paymentStatus" class="no-print" style="margin-top: 5px;">
          <option value="Paid">✅ Paid</option>
          <option value="Partial">🔶 Partial</option>
          <option value="Pending">⏳ Pending</option>
        </select>
        <span class="print-only" id="paymentStatusP"></span>
      </label>

      <label>Amount Received
        <input class="no-print" id="amountReceived" type="number" step="0.01" value="0" style="margin-top: 5px;" />
        <span class="print-only" id="amountReceivedP"></span>
      </label>

      <label>Balance Due
        <div id="balanceDisplay" style="margin-top: 5px; font-weight: 800; color: #ef4444; font-size: 16px; padding: 8px 12px; background: rgba(239,68,68,0.1); border-radius: 8px;">PKR 0.00</div>
      </label>
      
    </div>

    <label>Notes
      <textarea id="notes" class="no-print" rows="2" placeholder="Any additional notes..." style="margin-top: 5px;"></textarea>
    </label>
  </div>

  <p class="thanks">✨ Thank you for your business! ✨</p>
</div>

<script type="module" src="js/invoice.js"></script>
</body>
</html>
